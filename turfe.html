<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turfe</title>
    <link rel="stylesheet" href="style-turfe.css">
</head>
<body>

    <div class="logo">
        <img src="./img/logo-turfe.svg" alt="logo">
    </div>

    <div id="div_rodadas" class="paginaRodadas" style="display: flex;">
        <div class="quantidade">
            <p>Quantidade de cavalos: </p> 
            <input type="number" id="ipt_qtdCavalos"> <br>
            
            <p>Quantidade de rodadas: </p> 
            <input type="number" id="ipt_qtdRodadas"> <br>
            
            <button onclick="adicionarRodadas()" class="btn_rodadas">Avançar</button>
        </div>
    </div>

    <div id="div_nomeCavalo" class="paginaRodadas" style="display: none;">
        <div class="quantidade">
            <h3 id="titulo_nome_cavalo">Informe o nome do 1º cavalo:</h3>
            <input type="text" id="ipt_nomeCavalo"> <br>
            <button onclick="adicionarNome()" class="btn_rodadas">Cadastrar Nome</button>
        </div>
    </div>

    <div id="div_final" style="display: none;">
        <button onclick="iniciarContagem()" id="btn_iniciar" class="btn_turfe">INICIAR CORRIDA</button>
        <div id="div_msg"></div>
    </div>

    <script>
        let qtdCavalos = 0;
        let qtdRodadas = 0;
        let cavalos = []; 

        let imagens = [
            './img/cavalo (1).gif',
            './img/cavalo (2).gif',
            './img/cavalo (3).gif',
            './img/cavalo (4).gif',
            './img/cavalo (5).gif',
            './img/cavalo (6).gif'
        ];

        // 1. Validações iniciais
        function adicionarRodadas() {
            qtdCavalos = Number(ipt_qtdCavalos.value);
            qtdRodadas = Number(ipt_qtdRodadas.value);

            if (qtdCavalos < 2 || qtdCavalos > 6) {
                alert('A quantidade de cavalos deve estar entre 2 e 6');
                return; 
            }
            if (qtdRodadas < 2 || qtdRodadas > 10) {
                alert('A quantidade de rodadas deve estar entre 2 e 10');
                return;
            }

            
            div_rodadas.style.display = 'none';
            div_nomeCavalo.style.display = 'flex';
            titulo_nome_cavalo.innerHTML = `Informe o nome do 1º cavalo:`;
        }

       
        function adicionarNome() {
            let nome = ipt_nomeCavalo.value;

            if (nome == '') {
                alert('Digite um nome!');
                return;
            }

          
            cavalos.push({
                nome: nome,
                tempVoltas: [],
                total: 0
            });

           
            ipt_nomeCavalo.value = '';

           
            if (cavalos.length < qtdCavalos) {
                titulo_nome_cavalo.innerHTML = `Informe o nome do ${cavalos.length + 1}º cavalo:`;
            } else {
        
                div_nomeCavalo.style.display = "none";
                div_final.style.display = "block";
            }
        }

        function iniciarContagem() {
            btn_iniciar.style.display = 'none';

            let contagem = 3;
            div_msg.innerHTML = `<h1 style="text-align:center; font-size: 50px;">${contagem}</h1>`;

            let intervalo = setInterval(() => {
                contagem--;

                if (contagem > 0) {
                    div_msg.innerHTML = `<h1 style="text-align:center; font-size: 50px;">${contagem}</h1>`;
                } else if (contagem == 0) {
                    div_msg.innerHTML = `<h1 style="text-align:center; font-size: 50px; color: green;">VAI!</h1>`;
                } else {
                    clearInterval(intervalo);
                    
                    div_msg.innerHTML = `
                        <div class="gif-pista-container" style="text-align:center;">
                            <img src="./img/cavalos.gif" alt="Cavalos correndo" class="gif-pista">
                        </div>
                    `;

                    
                    setTimeout(() => {
                        div_msg.innerHTML = '';
                        executarCorrida();
                    }, 3000);
                }
            }, 1000);
        }

        
        function executarCorrida() {
            let corrida = "";

            for (let i = 0; i < qtdRodadas; i++) {
                corrida += `
                <div class="volta-box">
                    <h2>Volta ${i + 1}</h2>`;

                for (let i = 0; i < qtdCavalos; i++) {
                    let tempoAleatorio = Number((Math.random() * (9 - 7) + 7).toFixed(1));
                    
                   
                    cavalos[i].tempVoltas.push(tempoAleatorio);
                    cavalos[i].total += tempoAleatorio;

                    corrida += `
                    <div class="linha-cavalo" style="display:flex; align-items:center; gap: 15px;">
                        <img src="${imagens[i]}" width="50px">
                        <p><b>${cavalos[i].nome}</b> - ${tempoAleatorio} min | Total: ${cavalos[i].total.toFixed(1)} min</p>
                    </div>`;
                }

                corrida += `<hr></div>`;
            }

            div_msg.innerHTML = corrida;
            calcularRanking();
        }

        function calcularRanking() {
            let resultados = cavalos; 
            let ranking = [];
            let usados = []; 

            let menor1 = 9999; 
            let indice1 = -1;

            for (let i = 0; i < resultados.length; i++) {
                if (resultados[i].total < menor1) {
                    menor1 = resultados[i].total;
                    indice1 = i;
                } else if (resultados[i].total == menor1) {
            
                    let ultimaI = resultados[i].tempVoltas[resultados[i].tempVoltas.length - 1];
                    let ultimaAtual = resultados[indice1].tempVoltas[resultados[indice1].tempVoltas.length - 1];
                    if (ultimaI < ultimaAtual) {
                        indice1 = i;
                    }
                }
            }
            if (indice1 != -1) {
                ranking.push(resultados[indice1]);
                usados.push(indice1); 
            }

            if (resultados.length >= 2) {
                let menor2 = 9999;
                let indice2 = -1;

                for (let i = 0; i < resultados.length; i++) {
                    if (!usados.includes(i)) { 
                        if (resultados[i].total < menor2) {
                            menor2 = resultados[i].total;
                            indice2 = i;
                        } else if (resultados[i].total == menor2) {
                        
                            let ultimaI = resultados[i].tempVoltas[resultados[i].tempVoltas.length - 1];
                            let ultimaAtual = resultados[indice2].tempVoltas[resultados[indice2].tempVoltas.length - 1];
                            if (ultimaI < ultimaAtual) {
                                indice2 = i;
                            }
                        }
                    }
                }
                if (indice2 != -1) {
                    ranking.push(resultados[indice2]);
                    usados.push(indice2);
                }
            }

            
            if (resultados.length >= 3) {
                let menor3 = 9999;
                let indice3 = -1;

                for (let i = 0; i < resultados.length; i++) {
                    if (!usados.includes(i)) {
                        if (resultados[i].total < menor3) {
                            menor3 = resultados[i].total;
                            indice3 = i;
                        } else if (resultados[i].total == menor3) {
                        
                            let ultimaI = resultados[i].tempVoltas[resultados[i].tempVoltas.length - 1];
                            let ultimaAtual = resultados[indice3].tempVoltas[resultados[indice3].tempVoltas.length - 1];
                            if (ultimaI < ultimaAtual) {
                                indice3 = i;
                            }
                        }
                    }
                }
                if (indice3 != -1) {
                    ranking.push(resultados[indice3]);
                    usados.push(indice3);
                }
            }

            let podio = `<div style="margin-top: 30px; padding: 20px; background-color: #f0f0f0; border-radius: 10px;">
                                <h2> RESULTADO FINAL </h2>`;

            for (let i = 0; i < ranking.length; i++) {
                let colocacao = i + 1;
                let placar = i == 0 ? "1" : i == 1 ? "2" : "3";
                
                podio += `<p style="font-size: 18px;">
                                <b>${colocacao}º Lugar ${placar}:</b> ${ranking[i].nome} 
                                (${ranking[i].total.toFixed(1)} min)
                              </p>`;
            }

            podio += `</div>`;
            div_msg.innerHTML += podio;
        }
    </script>
</body>
</html>
