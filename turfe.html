<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turfe</title>
    <link rel="stylesheet" href="style-turfe.css">
</head>

<body>

    <h1>=================</h1>
    <h1>TURFE - DAMAGIBE</h1>
    <h1>=================</h1>

    <button onclick="volta()" class="button-turfe">DAR VOLTA</button>

    <div id="div_msg"></div>

    <div id="div_cav">
        <img src="./img/cavalo (1).gif"><br>
        <img src="./img/cavalo (2).gif"><br>
        <img src="./img/cavalo (3).gif"><br>
        <img src="./img/cavalo (4).gif"><br>
        <img src="./img/cavalo-branco.gif">
    </div>

</body>

</html>

<script>

    var cavalos = [
        {
            nome: 'Cavalo 1',
            tempVoltas: []
        },
        {
            nome: 'Cavalo 2',
            tempVoltas: []
        },
        {
            nome: 'Cavalo 3',
            tempVoltas: []
        },
        {
            nome: 'Cavalo 4',
            tempVoltas: []
        },
        {
            nome: 'Cavalo 5',
            tempVoltas: []
        }
    ];

    function volta() {

        div_msg.innerHTML = '';

        // resetando voltas anteriores
        for (let i = 0; i < cavalos.length; i++) {
            cavalos[i].tempVoltas = [];
        }

        let voltas = 7;

        // acumuladores
        let acumulo1 = 0;
        let acumulo2 = 0;
        let acumulo3 = 0;
        let acumulo4 = 0;
        let acumulo5 = 0;

        // referências
        let cav1 = cavalos[0];
        let cav2 = cavalos[1];
        let cav3 = cavalos[2];
        let cav4 = cavalos[3];
        let cav5 = cavalos[4];

        for (let i = 0; i < voltas; i++) {

            // sorteio entre 7 e 9
            let tempo1 = Number((Math.random() * (9 - 7) + 7).toFixed(1));
            let tempo2 = Number((Math.random() * (9 - 7) + 7).toFixed(1));
            let tempo3 = Number((Math.random() * (9 - 7) + 7).toFixed(1));
            let tempo4 = Number((Math.random() * (9 - 7) + 7).toFixed(1));
            let tempo5 = Number((Math.random() * (9 - 7) + 7).toFixed(1));

            // salvando tempos
            cav1.tempVoltas.push(tempo1);
            cav2.tempVoltas.push(tempo2);
            cav3.tempVoltas.push(tempo3);
            cav4.tempVoltas.push(tempo4);
            cav5.tempVoltas.push(tempo5);

            // acumulando
            acumulo1 += tempo1;
            acumulo2 += tempo2;
            acumulo3 += tempo3;
            acumulo4 += tempo4;
            acumulo5 += tempo5;

            // exibindo
            div_msg.innerHTML += `
            
            <b>Volta ${i + 1}</b> <br>

            <b>${cav1.nome}</b> - ${tempo1} min | Total: ${acumulo1.toFixed(1)} min <br>

            <b>${cav2.nome}</b> - ${tempo2} min | Total: ${acumulo2.toFixed(1)} min <br>

            <b>${cav3.nome}</b> - ${tempo3} min | Total: ${acumulo3.toFixed(1)} min <br>

            <b>${cav4.nome}</b> - ${tempo4} min | Total: ${acumulo4.toFixed(1)} min <br>

            <b>${cav5.nome}</b> - ${tempo5} min | Total: ${acumulo5.toFixed(1)} min <br>

            <hr>
            `;
        }

        // ranking
        let ranking = [
            {
                nome: cav1.nome,
                tempo: acumulo1
            },
            {
                nome: cav2.nome,
                tempo: acumulo2
            },
            {
                nome: cav3.nome,
                tempo: acumulo3
            },
            {
                nome: cav4.nome,
                tempo: acumulo4
            },
            {
                nome: cav5.nome,
                tempo: acumulo5
            }
        ];

    }

</script>
