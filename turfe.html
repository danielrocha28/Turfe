<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turfe</title>
    <link rel="stylesheet" href="style-turfe.css">
</head>
<body>

    <div class="logo">
        <img src="./img/logo-turfe.svg" alt="logo">
    </div>

    <div id="div_rodadas" class="paginaRodadas" style="display: flex;">
        <div class="quantidade">
            <p>Quantidade de cavalos (2 a 6): </p> 
            <input type="number" id="ipt_qtdCavalos"> <br>
            
            <p>Quantidade de rodadas (2 a 10): </p> 
            <input type="number" id="ipt_qtdRodadas"> <br>
            
            <button onclick="adicionarRodadas()" class="btn_rodadas">Avançar</button>
        </div>
    </div>

    <div id="div_nomeCavalo" class="paginaRodadas" style="display: none;">
        <div class="quantidade">
            <h3 id="titulo_nome_cavalo">Informe o nome do 1º cavalo:</h3>
            <input type="text" id="ipt_nomeCavalo"> <br>
            <button onclick="adicionarNome()" class="btn_rodadas">Cadastrar Nome</button>
        </div>
    </div>

    <div id="div_final" style="display: none;">
        <button onclick="iniciarContagem()" id="btn_iniciar" class="button-turfe">INICIAR CORRIDA</button>
        <div id="div_msg"></div>
    </div>

    <script>
        let qtdCavalos = 0;
        let qtdRodadas = 0;
        let cavalos = []; // Array que vai guardar os objetos dos cavalos dinamicamente

        let imagens = [
            './img/cavalo (1).gif',
            './img/cavalo (2).gif',
            './img/cavalo (3).gif',
            './img/cavalo (4).gif',
            './img/cavalo (5).gif',
            './img/cavalo (6).gif'
        ];

        // 1. Validações iniciais
        function adicionarRodadas() {
            qtdCavalos = Number(ipt_qtdCavalos.value);
            qtdRodadas = Number(ipt_qtdRodadas.value);

            if (qtdCavalos < 2 || qtdCavalos > 6) {
                alert('A quantidade de cavalos deve estar entre 2 e 6');
                return; // Para a execução se der erro
            }
            if (qtdRodadas < 2 || qtdRodadas > 10) {
                alert('A quantidade de rodadas deve estar entre 2 e 10');
                return; // Para a execução se der erro
            }

            // Esconde a div 1 e mostra a div 2
            div_rodadas.style.display = 'none';
            div_nomeCavalo.style.display = 'flex';
            titulo_nome_cavalo.innerHTML = `Informe o nome do 1º cavalo:`;
        }

        // 2. Cadastro dos nomes
        function adicionarNome() {
            let nome = ipt_nomeCavalo.value;

            if (nome == '') {
                alert('Digite um nome!');
                return;
            }

            // Adiciona o cavalo ao array com seus dados zerados
            cavalos.push({
                nome: nome,
                tempVoltas: [],
                total: 0
            });

            // Limpa o input para o próximo cavalo
            ipt_nomeCavalo.value = '';

            // Verifica se já cadastrou todos
            if (cavalos.length < qtdCavalos) {
                titulo_nome_cavalo.innerHTML = `Informe o nome do ${cavalos.length + 1}º cavalo:`;
            } else {
                // Terminou de cadastrar, vai para a etapa de corrida
                div_nomeCavalo.style.display = "none";
                div_final.style.display = "block";
            }
        }

        // 3. Contagem regressiva (Animação)
        function iniciarContagem() {
            btn_iniciar.style.display = 'none'; // Esconde o botão

            let contagem = 3;
            div_msg.innerHTML = `<h1 style="text-align:center; font-size: 50px;">${contagem}</h1>`;

            let intervalo = setInterval(() => {
                contagem--;

                if (contagem > 0) {
                    div_msg.innerHTML = `<h1 style="text-align:center; font-size: 50px;">${contagem}</h1>`;
                } else if (contagem == 0) {
                    div_msg.innerHTML = `<h1 style="text-align:center; font-size: 50px; color: green;">VAI!</h1>`;
                } else {
                    clearInterval(intervalo);
                    
                    // Coloca o gif da pista
                    div_msg.innerHTML = `
                        <div class="gif-pista-container" style="text-align:center;">
                            <img src="./img/cavalos.gif" alt="Cavalos correndo" class="gif-pista">
                        </div>
                    `;

                    // Depois de 3 segundos com o gif da pista, gera as voltas
                    setTimeout(() => {
                        div_msg.innerHTML = '';
                        executarCorrida();
                    }, 3000);
                }
            }, 1000);
        }

        // 4. Executa a matemática e imprime as voltas
        function executarCorrida() {
            let htmlCorrida = "";

            for (let i = 0; i < qtdRodadas; i++) {
                htmlCorrida += `
                <div class="volta-box">
                    <h2>Volta ${i + 1}</h2>`;

                // Faz um loop APENAS para a quantidade de cavalos escolhida
                for (let c = 0; c < qtdCavalos; c++) {
                    let tempoAleatorio = Number((Math.random() * (9 - 7) + 7).toFixed(1));
                    
                    // Salva os dados no objeto do cavalo
                    cavalos[c].tempVoltas.push(tempoAleatorio);
                    cavalos[c].total += tempoAleatorio;

                    // Cria a linha (div) de cada cavalo
                    htmlCorrida += `
                    <div class="linha-cavalo" style="display:flex; align-items:center; gap: 15px;">
                        <img src="${imagens[c]}" width="50px">
                        <p><b>${cavalos[c].nome}</b> - ${tempoAleatorio} min | Total: ${cavalos[c].total.toFixed(1)} min</p>
                    </div>`;
                }

                htmlCorrida += `<hr></div>`;
            }

            div_msg.innerHTML = htmlCorrida;
            calcularRanking();
        }

        // 5. Calcula quem ganhou
        function calcularRanking() {
            // Cria uma cópia do array de cavalos para não alterar a ordem original,
            // e então usa a função .sort() nativa do JS para ordenar pelo tempo total
            let ranking = [...cavalos].sort((a, b) => {
                // Se o total for igual, desempata pela última volta
                if (a.total.toFixed(1) === b.total.toFixed(1)) {
                    let ultimaVoltaA = a.tempVoltas[a.tempVoltas.length - 1];
                    let ultimaVoltaB = b.tempVoltas[b.tempVoltas.length - 1];
                    return ultimaVoltaA - ultimaVoltaB; 
                }
                // Ordena do menor tempo para o maior tempo
                return a.total - b.total;
            });

            // Imprime o pódio no HTML
            let htmlPodio = `<div style="margin-top: 30px; padding: 20px; background-color: #f0f0f0; border-radius: 10px;">
                                <h2>🏆 RESULTADO FINAL 🏆</h2>`;

            for (let i = 0; i < 3; i++) {
                if (ranking[i]) { // Confere se o cavalo existe (caso tenham jogado com apenas 2 cavalos)
                    let colocacao = i + 1;
                    let emoji = i === 0 ? "🥇" : i === 1 ? "🥈" : "🥉";
                    
                    htmlPodio += `<p style="font-size: 18px;">
                                    <b>${colocacao}º Lugar ${emoji}:</b> ${ranking[i].nome} 
                                    (${ranking[i].total.toFixed(1)} min)
                                  </p>`;
                }
            }

            htmlPodio += `</div>`;
            div_msg.innerHTML += htmlPodio;
        }
    </script>
</body>
</html>
