<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turfe</title>
    <link rel="stylesheet" href="style-turfe.css">
    
    <style>
        .podio-container {
            display: flex;
            justify-content: center;
            align-items: flex-end; 
            gap: 15px;
            margin-top: 20px;
            height: 240px; 
            overflow: hidden;
        }

        .degrau {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 130px;
            color: white;
            font-weight: bold;
            text-align: center;
            border-radius: 8px 8px 0 0;
            /* Faz o pódio nascer de baixo para cima */
            animation: subirPodio 1.5s ease-out forwards; 
            transform: translateY(100%); 
        }

        .degrau p { 
            margin: 4px 0; 
            font-size: 16px; 
            text-shadow: 1px 1px 2px black; 
        }
        
        .degrau img { 
            width: 75px; 
            margin-bottom: 5px; 
        }

        /* Cores, alturas e tempos de suspense de cada degrau */
        .degrau-1 { height: 180px; background-color: #FFD700; animation-delay: 1.2s; } /* Ouro */
        .degrau-2 { height: 135px; background-color: #C0C0C0; animation-delay: 0.6s; } /* Prata */
        .degrau-3 { height: 95px; background-color: #CD7F32; animation-delay: 0.1s; }  /* Bronze */

        .posicao-numero { 
            font-size: 35px; 
            margin-top: auto; 
            padding-bottom: 8px; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5); 
        }

        /* Animação do transform */
        @keyframes subirPodio {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="logo">
        <img src="./img/logo-turfe.svg" alt="logo">
    </div>

   <div id="div_rodadas" class="paginaRodadas" style="display: flex;">
        <div class="quantidade">
            <p>Quantidade de cavalos: </p>
            <input type="number" id="ipt_qtdCavalos"><br>
            <p>Quantidade de rodadas: </p>
            <input type="number" id="ipt_qtdRodadas"><br>
            <button onclick="adicionarRodadas()" class="btn_rodadas">Avançar</button>
        </div>
    </div>

    <div id="div_nomeCavalo" class="paginaRodadas" style="display: none;">
        <div class="quantidade">
            <h3 id="titulo_nome_cavalo">Informe o nome do 1º cavalo:</h3>
            <input type="text" id="ipt_nomeCavalo"><br>
            <button onclick="adicionarNome()" class="btn_rodadas">Cadastrar Nome</button>
        </div>
        
        <div id="div_listaCavalos" class="lista-cavalos">
        </div>
    </div>

    <div id="div_final" style="display: none;">
        <button onclick="iniciarContagem()" id="btn_iniciar" class="btn_turfe">INICIAR CORRIDA</button>
        <div id="div_msg"></div>
    </div>

    <audio  id="musicaCorrida" src="./img/musica_corrida.mp3"></audio>
    <audio  id="musicaPodio" src="./img/musica_podio.mp3"></audio>

    <script>
        let qtdCavalos = 0;
        let qtdRodadas = 0;
        let cavalos = [];

        let imagens = [
            './img/cavalo (1).gif',
            './img/cavalo (2).gif',
            './img/cavalo (3).gif',
            './img/cavalo (4).gif',
            './img/cavalo (5).gif',
            './img/cavalo (6).gif'
        ];

        const CORES = ['#FF4444', '#44AAFF', '#44DD44', '#FFAA00', '#FF44FF', '#00CCCC'];

        function adicionarRodadas() {
            qtdCavalos = Number(ipt_qtdCavalos.value);
            qtdRodadas = Number(ipt_qtdRodadas.value);
            if (qtdCavalos < 2 || qtdCavalos > 6) { alert('A quantidade de cavalos deve estar entre 2 e 6'); return; }
            if (qtdRodadas < 2 || qtdRodadas > 10) { alert('A quantidade de rodadas deve estar entre 2 e 10'); return; }
            div_rodadas.style.display = 'none';
            div_nomeCavalo.style.display = 'flex';
            titulo_nome_cavalo.innerHTML = `Informe o nome do 1º cavalo:`;
        }

        function adicionarNome() {
            let nome = ipt_nomeCavalo.value;
            if (nome == '') { alert('Digite um nome!'); return; }

            let indiceCavalo = cavalos.length; 

            div_listaCavalos.style.display='flex';
            div_listaCavalos.style.flexDirection='row';
            div_listaCavalos.style.flexWrap='wrap';
            div_listaCavalos.style.justifyContent='flex-start';
            div_listaCavalos.style.gap='15px';

            div_listaCavalos.innerHTML += `
                <div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-start; flex-wrap: wrap;">
                    <img src="${imagens[indiceCavalo]}" style="width: 80px;">
                    <p style="color: white; font-size: 24px; margin-top: 10px; font-weight: bold;">${nome}</p>
                </div>
            `;
            cavalos.push({ nome, tempVoltas: [], total: 0 });
            ipt_nomeCavalo.value = '';

            if (cavalos.length < qtdCavalos) {
                titulo_nome_cavalo.innerHTML = `Informe o nome do ${cavalos.length + 1}º cavalo:`;
            } else {
                titulo_nome_cavalo.innerHTML = `Todos os cavalos cadastrados!`;
                
                setTimeout(() => {
                    div_nomeCavalo.style.display = 'none';
                    div_final.style.display = 'block'; 
                }, 3000);
            }
        }

        function iniciarContagem() {
            btn_iniciar.style.display = 'none';
            let contagem = 3;
            div_msg.innerHTML = `<h1 style="text-align:center;font-size:50px;">${contagem}</h1>`;

            let intervalo = setInterval(() => {
                contagem--;
                if (contagem > 0) {
                    div_msg.innerHTML = `<h1 style="text-align:center;font-size:50px;">${contagem}</h1>`;
                } else if (contagem == 0) {
                    div_msg.innerHTML = `<h1 style="text-align:center;font-size:50px;color:white;">VAI!</h1>`;
                } else {
                    clearInterval(intervalo);
                    executarCorrida();
                }
            }, 1000);
        }

        function executarCorrida() {
            for (let v = 0; v < qtdRodadas; v++) {
                for (let c = 0; c < qtdCavalos; c++) {
                    let tempo = Number((Math.random() * (9 - 7) + 7).toFixed(1));
                    cavalos[c].tempVoltas.push(tempo);
                    cavalos[c].total += tempo;
                }
            }

            animarCorrida(() => {
                div_msg.innerHTML = '';
                calcularRanking();      
                mostrarResultados();    
            });
        }

        function animarCorrida(callback) {
            const DURACAO_MS = 10000;
            tocarCorrida();

            div_msg.innerHTML = `
                <div id="corrida-wrap" style="
                    position: relative;
                    width: 100%;
                    max-width: 960px;
                    margin: 0 auto;
                    border-radius: 12px;
                    overflow: hidden;
                    box-shadow: 0 6px 24px rgba(0,0,0,.5);
                ">
                    <img id="pista-img" src="./img/pista.svg"
                         style="width:100%; display:block;" alt="pista">
                </div>
            `;

            const wrap     = document.getElementById('corrida-wrap');
            const pistaImg = document.getElementById('pista-img');

            function rodar() {
                const W_WRAP = wrap.offsetWidth;
                const H_WRAP = wrap.offsetHeight;

                const X_INICIO = W_WRAP * 0.04;
                const X_FIM    = W_WRAP * 0.88;
                const Y_CENTRO = H_WRAP * 0.50;
                const ESPACO   = H_WRAP * 0.055;
                const W_GIF    = W_WRAP * 0.12;
                const offset   = ((qtdCavalos - 1) * ESPACO) / 2;

                const menorTempo = Math.min(...cavalos.map(c => c.total));

                let imgs = [];
                for (let i = 0; i < qtdCavalos; i++) {
                    const img = document.createElement('img');
                    img.src = imagens[i];
                    img.style.position = 'absolute';
                    img.style.width = W_GIF + 'px';
                    img.style.top = (Y_CENTRO - offset + i * ESPACO) + 'px';
                    img.style.left = X_INICIO + 'px';
                    wrap.appendChild(img);
                    imgs.push(img);
                }

                const inicio = performance.now();

                function desenhar(agora) {
                    const t = Math.min((agora - inicio) / DURACAO_MS, 1);

                    for (let i = 0; i < qtdCavalos; i++) {
                        const vel = menorTempo / cavalos[i].total;
                        imgs[i].style.left = (X_INICIO + t * vel * (X_FIM - X_INICIO)) + 'px';
                    }

                    if (t < 1) requestAnimationFrame(desenhar);
                    else setTimeout(callback, 700);
                }

                requestAnimationFrame(desenhar);
            }

            if (pistaImg.complete && pistaImg.naturalWidth > 0) {
                rodar();
            } else {
                pistaImg.onload  = rodar;
                pistaImg.onerror = () => { div_msg.innerHTML = ''; callback(); };
            }
        }

        function mostrarResultados() {
    let html = `
        <div class="volta-box" style="margin-top: 40px; text-align: center;">
            <h2 style="color: white; font-size: 26px; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); font-weight: bold; letter-spacing: 1px;">
                TEMPOS DA CORRIDA
            </h2>

            <table class="tabela-resultados" style="
                width: 100%;
                max-width: 960px;
                margin: 0 auto;
                border-collapse: collapse;
                background: rgba(10, 25, 47, 0.85); /* Fundo escuro semi-transparente */
                color: white !important;
                border-radius: 12px;
                overflow: hidden;
                border: 2px solid #44AAFF; /* Borda azul combinando com seu grid */
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            ">
                <tr style="background-color: #0055ff; color: white;">
                    <th style="padding: 14px; border: 1px solid rgba(68, 170, 255, 0.3); font-size: 16px;">Volta</th>
    `;

    for (let c = 0; c < qtdCavalos; c++) {
        html += `<th style="padding: 14px; border: 1px solid rgba(68, 170, 255, 0.3); font-size: 16px;">${cavalos[c].nome}</th>`;
    }

    html += `</tr>`;

    for (let v = 0; v < qtdRodadas; v++) {
        // Alterna as cores das linhas sutilmente para facilitar a leitura
        let bgLinha = v % 2 === 0 ? 'rgba(255, 255, 255, 0.03)' : 'rgba(255, 255, 255, 0.08)';
        
        html += `<tr style="background: ${bgLinha}; color: white !important;">`;
        html += `<td style="padding: 12px; border: 1px solid rgba(68, 170, 255, 0.2); color: white;"><b>Volta ${v + 1}</b></td>`;

        for (let c = 0; c < qtdCavalos; c++) {
            html += `<td style="padding: 12px; border: 1px solid rgba(68, 170, 255, 0.2); color: white;">${cavalos[c].tempVoltas[v].toFixed(1)} min</td>`;
        }

        html += `</tr>`;
    }

    // Linha de totais destacada com um tom azulado do tema
    html += `
        <tr class="linha-total" style="background: rgba(0, 85, 255, 0.25); color: #44AAFF !important; font-weight: bold;">
            <td style="padding: 14px; border: 1px solid rgba(68, 170, 255, 0.3); color: #44AAFF;"><b>Total</b></td>
    `;

    for (let c = 0; c < qtdCavalos; c++) {
        html += `<td style="padding: 14px; border: 1px solid rgba(68, 170, 255, 0.3); color: #44AAFF;"><b>${cavalos[c].total.toFixed(1)} min</b></td>`;
    }

    html += `
            </tr>
        </table>
        </div>
    `;

    // Aplica mantendo o pódio intacto acima
    div_msg.innerHTML += html;
}

function calcularRanking() {

            tocarPodio();
    function encontrarMenor(excluidos) {
        let menor = Infinity, idx = -1;
        cavalos.forEach((c, i) => {
            if (excluidos.includes(i)) return;
            const ultima = c.tempVoltas.at(-1);
            if (c.total < menor ||
                (c.total === menor && ultima < cavalos[idx].tempVoltas.at(-1))) {
                menor = c.total;
                idx = i;
            }
        });
        return idx;
    }

    const usados  = [];
    const ranking = [];
    const total   = Math.min(3, cavalos.length);
    
    for (let p = 0; p < total; p++) {
        const idx = encontrarMenor(usados);
        if (idx !== -1) { 
            ranking.push({ ...cavalos[idx], imagem: imagens[idx] }); 
            usados.push(idx); 
        }
    }

    let podioHTML = `
        <div style="text-align:center; margin-top:20px; color:white;">
            <h2 style="font-size: 26px; font-weight: bold; letter-spacing: 1px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">
                PÓDIO FINAL
            </h2>
            <div class="podio-container">
    `;

    // DEGRAU 2 (Prata - Esquerda)
    if (ranking[1]) {
        podioHTML += `
            <div class="degrau degrau-2">
                <img src="${ranking[1].imagem}" alt="2º Lugar">
                <p style="color: #111 !important;">${ranking[1].nome}</p>
                <p style="font-size:13px; color: #333 !important;">${ranking[1].total.toFixed(1)} min</p>
                <div class="posicao-numero">2º</div>
            </div>`;
    }

    // DEGRAU 1 (Ouro - Centro)
    if (ranking[0]) {
        podioHTML += `
            <div class="degrau degrau-1">
                <img src="${ranking[0].imagem}" alt="1º Lugar">
                <p style="color: #111 !important;">${ranking[0].nome}</p>
                <p style="font-size:13px; color: #333 !important;">${ranking[0].total.toFixed(1)} min</p>
                <div class="posicao-numero">1º</div>
            </div>`;
    }

    // DEGRAU 3 (Bronze - Direita)
    if (ranking[2]) {
        podioHTML += `
            <div class="degrau degrau-3">
                <img src="${ranking[2].imagem}" alt="3º Lugar">
                <p style="color: #FFF !important;">${ranking[2].nome}</p>
                <p style="font-size:13px; color: #DDD !important;">${ranking[2].total.toFixed(1)} min</p>
                <div class="posicao-numero">3º</div>
            </div>`;
    }

    podioHTML += `
            </div>
        </div>`;

    div_msg.innerHTML = podioHTML;
}

function tocarPodio() {
    let musica = document.getElementById("musicaPodio")

    if (musica.paused) {
        musica.play()
    } else {
        musica.pause
    }
}   

function tocarCorrida() {
    let musica = document.getElementById("musicaCorrida")

    if (musica.paused) {
        musica.play()
    } else {
        musica.pause
    }
}   


    </script>
</body>
</html>
